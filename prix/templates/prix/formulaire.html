{% extends "prix/base.html" %}
{% block titre %}{{ titre }} - PrixMarché{% endblock %}

{% block contenu %}
<h2>{{ titre }}</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_div }}
  <p>
    <button type="submit" class="bouton">Enregistrer</button>
    <a href="{% url retour %}">Annuler</a>
  </p>
</form>
{% endblock %}
